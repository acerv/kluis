[workspace]
resolver = "2"
members = ["harness-core", "harness-tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
authors = ["Andrea Cervesato <andrea.cervesato@linux.dev>"]

[workspace.dependencies]
harness-core = { path = "harness-core" }
harness-tools = { path = "harness-tools" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = "1"
