[workspace]
resolver = "2"
members = [
    "harness-core",
    "harness-sandbox",
    "harness-tools",
    "harness-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Andrea Cervesato <andrea.cervesato@linux.dev>"]

[workspace.dependencies]
harness-core = { path = "harness-core" }
harness-sandbox = { path = "harness-sandbox" }
harness-tools = { path = "harness-tools" }
harness-tui = { path = "harness-tui" }

genai = "0.7.5"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
futures-util = { version = "0.3", default-features = false }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
hakoniwa = { version = "1.8", features = ["landlock"] }
ignore = "0.4"
libc = "0.2"
openssl-probe = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }
tokio = "1"
tui-markdown = "0.3"
