[package]
name = "harness-cli"
description = "Line-based command-line coding agent with native sandboxing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kl-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
harness-core.workspace = true
harness-sandbox.workspace = true
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "io-util"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
