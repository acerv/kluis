[package]
name = "harness-tools"
description = "Minimal serde-friendly tools for LLM harnesses"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anstyle-parse.workspace = true
genai.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
memchr.workspace = true
nix.workspace = true
scopeguard.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "time"] }
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util", "time"] }
