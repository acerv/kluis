[package]
name = "harness-tools"
description = "Minimal serde-friendly tools for LLM harnesses"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
genai.workspace = true
globset.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "time"] }
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util", "time"] }
