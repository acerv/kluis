    # heapless 0.7 unsound (hakoniwa -> postcard); we use none of its APIs
    "RUSTSEC-2026-0574",
    "RUSTSEC-2026-0575",
    "RUSTSEC-2026-0576",
    "RUSTSEC-2026-0577",
