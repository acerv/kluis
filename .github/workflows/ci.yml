name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sandbox tests create user namespaces, which Ubuntu 24.04 blocks
      # for unprivileged programs by default.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --workspace

  apparmor:
    name: AppArmor profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin kl
      # With the restriction on, kl stops and explains the setup.
      - name: Detect the restriction
        run: |
          if target/debug/kl < /dev/null 2> err.txt; then exit 1; fi
          cat err.txt
          grep -q "AppArmor blocks" err.txt
      # The commands kl prints, run as a user would.
      - name: Install the profile
        run: |
          sudo install -m 755 target/debug/kl /usr/local/bin/kl
          /usr/local/bin/kl --apparmor-profile | sudo tee /etc/apparmor.d/kl > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/kl
      - name: Run sandboxed under the profile
        run: |
          export HOME=$(mktemp -d)
          git config --global safe.bareRepository explicit
          /usr/local/bin/kl < /dev/null | tee out.txt
          grep -q sandboxed out.txt
