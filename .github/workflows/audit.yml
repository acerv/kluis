name: Audit

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock]
  pull_request:
    paths: [Cargo.toml, Cargo.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
