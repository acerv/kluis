[package]
name = "harness-tui"
description = "Inline terminal coding agent with native sandboxing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "kl"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
genai.workspace = true
harness-core.workspace = true
harness-sandbox.workspace = true
ignore.workspace = true
libc.workspace = true
ratatui.workspace = true
scopeguard.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tui-markdown.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true
vt100.workspace = true
